<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumple Cande! 🍪🐱✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --pastel-pink: #FFD1DC;
            --dulce-de-leche: #C67D33;
            --deep-purple: #3A1C49;
            --bright-magenta: #EC407A;
            --soft-yellow: #FFF59D;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #2E1437 0%, #4A154B 50%, #6B114D 100%);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(46, 20, 55, 0.9);
            backdrop-filter: blur(12px);
            border: 3px solid var(--dulce-de-leche);
            border-radius: 28px;
            padding: 30px 22px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(198, 125, 51, 0.4);
            position: relative;
        }

        h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 2.3rem;
            color: var(--soft-yellow);
            margin-bottom: 5px;
            text-shadow: 3px 3px 0px var(--bright-magenta);
        }

        .subtitle {
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--pastel-pink);
            margin-bottom: 25px;
            font-weight: 700;
        }

        .icons {
            font-size: 1.8rem;
            margin-bottom: 15px;
            letter-spacing: 8px;
        }

        .horoscope-card {
            background: linear-gradient(180deg, rgba(236, 64, 122, 0.2) 0%, rgba(198, 125, 51, 0.3) 100%);
            border: 2px dashed var(--soft-yellow);
            border-radius: 20px;
            padding: 25px 20px;
            margin: 20px 0;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.5s ease;
        }

        .horoscope-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.2rem;
            color: var(--soft-yellow);
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .horoscope-text {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #FFFFFF;
            font-style: italic;
        }

        .btn {
            background: linear-gradient(45deg, #EC407A, #FFB74D);
            color: #2E1437;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.2rem;
            text-transform: uppercase;
            padding: 16px 32px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(236, 64, 122, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(236, 64, 122, 0.7);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .from-friends {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 245, 157, 0.3);
            font-size: 0.95rem;
            color: #E0E0E0;
        }

        .friends-names {
            font-family: 'Fredoka', sans-serif;
            color: var(--soft-yellow);
            font-size: 1.2rem;
            margin-top: 6px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icons">👩‍🏫 🍪 🐱 🎸 ✨</div>
        <h1>¡Feliz Cumple Cande!</h1>
        <div class="subtitle">Horóscopo Místico & Dulce de Leche</div>

        <div class="horoscope-card" id="card">
            <div class="horoscope-title" id="title">✨ Consultá el Oráculo de Cande ✨</div>
            <div class="horoscope-text" id="text">Tocá el botón para descubrir tu predicción cósmica, gastronómica y babasónica para este nuevo año...</div>
        </div>

        <button class="btn" onclick="revelarDestino()"> Revelar mi Predicción </button>

        <div class="from-friends">
            Te amamos con todo el corazón:
            <div class="friends-names">Dai • Jor • Martina • Nati</div>
        </div>
    </div>

    <script>
        const predicciones = [
            {
                titulo: "🍪✨ Astrología de Relleno Doble",
                texto: "Tus astros se alinean con la masa perfecta. Este año vas a lograr alfajores tan galácticos que hasta en el jardín te van a pedir la receta para la merienda oficial."
            },
            {
                titulo: "🎸🔥 Carismática & Irresistible",
                texto: "Como dice Babasónicos: 'Sos el vicio de este nuevo año'. Vas a andar por la vida con onda psicodélica, paciencia infinita de seño y cero drama."
            },
            {
                titulo: "🐾🔮 Oráculo Michi-Místico",
                texto: "Tu gato leyó las estrellas y confirma que este año se vienen puras siestas reconstituyentes, abundancia de dulzura y cero rondas con niños gritando a la siesta."
            },
            {
                titulo: "🎨🍭 Señorita Universo",
                texto: "Predicción indiscutible: vas a tener un año repleto de dibujos hermosos, tazas de café calientes a tiempo, alfajores caseros infinitos y momentos épicos con tus mejores amigas."
            }
        ];

        let index = 0;

        function revelarDestino() {
            const pred = predicciones[index % predicciones.length];
            index++;

            const titleEl = document.getElementById('title');
            const textEl = document.getElementById('text');

            titleEl.innerText = pred.titulo;
            textEl.innerText = pred.texto;

            // Confeti en tonos rosa, dulce de leche (dorado) y amarillo
            confetti({
                particleCount: 85,
                spread: 75,
                origin: { y: 0.6 },
                colors: ['#EC407A', '#FFB74D', '#FFF59D', '#C67D33']
            });
        }
    </script>
</body>
</html>
